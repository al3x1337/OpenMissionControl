name: Release

on:
  push:
    tags:
      - "v*" # Triggers on tags like v1.0.0, v2.1, etc.
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: 'Sync with upstream master before releasing?'
        required: true
        type: boolean
        default: true
      custom_tag:
        description: 'Release tag (leave blank to auto-detect e.g. v1.1.4-al3x.2)'
        required: false
        type: string
        default: ''

jobs:
  build-and-release:
    runs-on: macos-26
    permissions:
      contents: write # Required to create a GitHub Release and push tags

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Upstream & Tag (Workflow Dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config checkout.defaultRemote origin

          if [ "${{ inputs.sync_upstream }}" = "true" ]; then
            echo "Fetching upstream..."
            git remote add upstream https://github.com/nohackjustnoobb/OpenMissionControl.git 2>/dev/null || true
            git fetch upstream --tags

            echo "Updating master branch to mirror upstream..."
            git checkout -B master origin/master
            git merge --ff-only upstream/master || git reset --hard upstream/master
            git push origin master

            echo "Merging master into release..."
            git checkout release
            git merge master --no-ff -m "chore(sync): sync upstream changes into release"
          fi

          # Determine the release tag
          if [ -n "${{ inputs.custom_tag }}" ]; then
            TAG="${{ inputs.custom_tag }}"
          else
            UPSTREAM_TAG=$(git tag -l "v*" --sort=-v:refname | grep -v "al3x" | head -n 1)
            if [ -z "$UPSTREAM_TAG" ]; then
              UPSTREAM_TAG="v1.1.4"
            fi
            COUNT=$(git tag -l "${UPSTREAM_TAG}-al3x.*" | wc -l | tr -d ' ')
            NEXT_INDEX=$((COUNT + 1))
            TAG="${UPSTREAM_TAG}-al3x.${NEXT_INDEX}"
          fi

          echo "Target Release Tag: $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin release
          git push origin "$TAG"

          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Resolve Release Tag for Tag Push
        if: github.event_name == 'push'
        run: |
          echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js (for create-dmg)
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Build and Create DMG
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload .app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Open Mission Control.app"
          path: "build/Build/Products/Release/Open Mission Control.app"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: "*.dmg" # Automatically grabs the output DMG
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
